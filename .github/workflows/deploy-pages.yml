name: Deploy to GitHub Pages
# 把 web/ 推到 gh-pages 分支；公开仓库会自动从该分支发布 Pages，无需手动在设置里开启。
# Publishes web/ to the gh-pages branch; public repos serve Pages from it automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: touch web/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
